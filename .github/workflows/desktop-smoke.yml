name: desktop-smoke

on:
  push:
    paths:
      - "x_news_station/**"
      - ".github/workflows/desktop-smoke.yml"
  pull_request:
    paths:
      - "x_news_station/**"
      - ".github/workflows/desktop-smoke.yml"

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: x_news_station
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Run health check
        env:
          QT_QPA_PLATFORM: offscreen
        run: python main.py --health-check

      - name: Run smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python main.py --smoke-test

      - name: Build desktop bundle (Windows)
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File packaging/build_windows.ps1

      - name: Build desktop bundle (Linux)
        if: runner.os == 'Linux'
        run: bash packaging/build_linux.sh
